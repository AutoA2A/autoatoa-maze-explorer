<body>
<div class="container">
    <nav class="navbar">
        <a href="index.html">首页</a>

    <main class="content">
        
<sectionclass="section">
  <h2 style="color:var(--primary);margin-bottom:8px;">迷宫编辑器</h2>
  <div class="media">
    <article class="card">
      <h3 style="margin-top:0;color:var(--primary);">工具</h3>
      <p>模式：
        <select id="modeSelect">
          <option value="wall">墙壁</option>
          <option value="start">起点</option>
          <option value="end">终点</option>
          <option value="erase">擦除</option>
        </select>
      </p>
      <button class="btn" id="clearBtn">清空</button>
      <button class="btn" id="saveBtn">保存</button>
      <button class="btn" id="loadBtn">读取</button>
      <button class="btn" id="exportBtn">导出</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
      <button class="btn" id="importBtn">导入</button>
      <div id="status" style="margin-top:8px;font-size:0.9em;color:#555;"></div>
    </article>
    <canvas id="mazeCanvas" width="400" height="400"></canvas>
  </div>
</section>

<script>
(() => {
  const canvas = document.getElementById('mazeCanvas');
  const ctx = canvas.getContext('2d');
  const modeSelect = document.getElementById('modeSelect');
  const clearBtn = document.getElementById('clearBtn');
  const saveBtn = document.getElementById('saveBtn');
  const loadBtn = document.getElementById('loadBtn');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  const statusEl = document.getElementById('status');

  const CELL_SIZE = 20;
  let COLS = 20, ROWS = 20;
  canvas.width = COLS * CELL_SIZE;
  canvas.height = ROWS * CELL_SIZE;

  // 0 empty, 1 wall, 2 start, 3 end
  let grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  let startPos = null;
  let endPos = null;

  function drawGrid() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // draw cells
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = c * CELL_SIZE;
        const y = r * CELL_SIZE;
        switch (grid[r][c]) {
          case 1: // wall
            ctx.fillStyle = '#555';
            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
            break;
          case 2: // start
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
            break;
          case 3: // end
            ctx.fillStyle = '#f44336';
            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
            break;
          default:
            ctx.strokeStyle = '#ddd';
            ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
        }
      }
    }
  }

  function getCellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const c = Math.floor(x / CELL_SIZE);
    const r = Math.floor(y / CELL_SIZE);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
    return {r, c};
  }

  function handleClick(e) {
    const cell = getCellFromEvent(e);
    if (!cell) return;
    const {r, c} = cell;
    const mode = modeSelect.value;
    if (mode === 'wall') {
      grid[r][c] = 1;
    } else if (mode === 'start') {
      if (startPos) grid[startPos.r][startPos.c] = 0;
      grid[r][c] = 2;
      startPos = {r, c};
    } else if (mode === 'end') {
      if (endPos) grid[endPos.r][endPos.c] = 0;
      grid[r][c] = 3;
      endPos = {r, c};
    } else if (mode === 'erase') {
      if (grid[r][c] === 2) startPos = null;
      if (grid[r][c] === 3) endPos = null;
      grid[r][c] = 0;
    }
    drawGrid();
  }

  canvas.addEventListener('mousedown', handleClick);
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    handleClick(e.touches[0]);
  }, {passive: false});

  clearBtn.addEventListener('click', () => {
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    startPos = null;
    endPos = null;
    drawGrid();
    statusEl.textContent = '已清空';
  });

  function saveToStorage() {
    const data = {
      grid,
      startPos,
      endPos,
      cols: COLS,
      rows: ROWS,
      cellSize: CELL_SIZE
    };
    localStorage.setItem('mazeEditorData', JSON.stringify(data));
    statusEl.textContent = '已保存到本地存储';
  }

  function loadFromStorage() {
    const data = localStorage.getItem('mazeEditorData');
    if (!data) {
      statusEl.textContent = '本地存储中无数据';
      return;
    }
    try {
      const parsed = JSON.parse(data);
      grid = parsed.grid;
      startPos = parsed.startPos;
      endPos = parsed.endPos;
      COLS = parsed.cols || COLS;
      ROWS = parsed.rows || ROWS;
      canvas.width = COLS * CELL_SIZE;
      canvas.height = ROWS * CELL_SIZE;
      drawGrid();
      statusEl.textContent = '已从本地存储读取';
    } catch (e) {
      statusEl.textContent = '读取失败：数据损坏';
    }
  }

  saveBtn.addEventListener('click', saveToStorage);
  loadBtn.addEventListener('click', loadFromStorage);

  exportBtn.addEventListener('click', () => {
    const data = {
      grid,
      startPos,
      endPos,
      cols: COLS,
      rows: ROWS,
      cellSize: CELL_SIZE
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'maze.json';
    a.click();
    URL.revokeObjectURL(url);
    statusEl.textContent = '已导出为 maze.json';
  });

  importBtn.addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        grid = parsed.grid;
        startPos = parsed.startPos;
        endPos = parsed.endPos;
        COLS = parsed.cols || COLS;
        ROWS = parsed.rows || ROWS;
        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;
        drawGrid();
        statusEl.textContent = '导入成功';
      } catch (err) {
        statusEl.textContent = '导入失败：无效的 JSON';
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // 初始绘制
  drawGrid();
})();
</script>
