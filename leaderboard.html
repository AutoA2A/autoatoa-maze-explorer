<section class="section">
    <h2>排行榜</h2>
    <div>
        <button id="clearBtn" class="btn">清除记录</button>
        <table id="lbTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th data-key="time">时间 (秒)</th>
                    <th data-key="steps">步数</th>
                    <th data-key="date">日期</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id="emptyMsg" class="empty" style="display:none;">
            <svg width="64" height="64" fill="var(--primary)" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="8" fill="var(--bg)"/><path d="M32 20a12 12 0 110 24 12 12 0 010-24z" fill="var(--primary)"/></svg>
            <p>暂无记录</p>
        </div>
    </div>
</section>

<script>
(function () {
    const STORAGE_KEY = 'mazeLeaderboard';
    const tbl = document.getElementById('lbTable');
    const tbody = tbl.querySelector('tbody');
    const clearBtn = document.getElementById('clearBtn');
    const emptyMsg = document.getElementById('emptyMsg');

    let sortKey = 'time';
    let sortAsc = true;

    function loadRecords() {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    }

    function saveRecords(arr) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    }

    function render() {
        const records = loadRecords();
        if (records.length === 0) {
            tbl.style.display = 'none';
            emptyMsg.style.display = 'block';
            return;
        }
        tbl.style.display = 'table';
        emptyMsg.style.display = 'none';

        // sort
        const sorted = [...records].sort((a, b) => {
            let av = a[sortKey];
            let bv = b[sortKey];
            if (typeof av === 'string') {
                av = new Date(av).getTime();
                bv = new Date(bv).getTime();
            }
            return sortAsc ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
        });

        tbody.innerHTML = '';
        sorted.forEach(rec => {
            const tr = document.createElement('tr');
            const timeTd = document.createElement('td');
            timeTd.textContent = rec.time.toFixed(2);
            const stepsTd = document.createElement('td');
            stepsTd.textContent = rec.steps;
            const dateTd = document.createElement('td');
            const date = new Date(rec.date);
            dateTd.textContent = date.toLocaleString();
            tr.append(timeTd, stepsTd, dateTd);
            tbody.appendChild(tr);
        });
    }

    function setSort(key) {
        if (sortKey === key) {
            sortAsc = !sortAsc;
        } else {
            sortKey = key;
            sortAsc = true;
        }
        // update header arrows
        document.querySelectorAll('#lbTable thead th').forEach(th => {
            th.textContent = th.dataset.key === 'time' ? '时间 (秒)' :
                             th.dataset.key === 'steps' ? '步数' : '日期';
            if (th.dataset.key === key) {
                th.textContent += sortAsc ? ' ▲' : ' ▼';
            }
        });
        render();
    }

    // init header click
    document.querySelectorAll('#lbTable thead th').forEach(th => {
        th.style.cursor = 'pointer';
        th.addEventListener('click', () => setSort(th.dataset.key));
    });

    clearBtn.addEventListener('click', () => {
        if (confirm('确定要清除所有排行榜记录吗？')) {
            localStorage.removeItem(STORAGE_KEY);
            render();
        }
    });

    // initial render
    render();
})();
</script>
